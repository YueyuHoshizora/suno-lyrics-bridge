<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>YuMeew Suno 字幕匯出</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Suno 字幕／歌詞擷取</h1>
    <p class="subtitle">使用你目前已登入的 Suno 帳號，讀取歌曲的逐字時間軸歌詞（不會另外儲存帳密）。</p>
  </header>

  <section class="field">
    <label for="song-url">Suno 網址（分享連結或 <code>/song/&lt;id&gt;</code> 都可以，擷取歌詞需要 <code>/song/&lt;id&gt;</code>）</label>
    <input id="song-url" type="url" placeholder="https://suno.com/song/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
  </section>

  <button id="fetch-button" class="primary-button" type="button">擷取歌詞時間軸</button>
  <button id="apply-audio-button" class="text-button full-width" type="button">下載音樂並套用到主畫面</button>
  <p class="hint">會在 YuMeew 開啟（或切到）suno-tool.html 分頁，用網站原本的「取得音樂」＋「套用到主畫面」流程自動跑完，音樂會存進主畫面可用的本機資料庫。跟上面的字幕擷取互不影響，兩個都做的話字幕編輯器重新整理後會同時看到音樂與字幕。</p>

  <p id="status" class="status" role="status"></p>
  <p id="audio-status" class="status" role="status"></p>

  <section id="result" class="result" hidden>
    <p id="result-summary"></p>
    <div class="actions">
      <button id="download-srt" class="text-button" type="button">下載 SRT</button>
      <button id="download-lrc" class="text-button" type="button">下載 LRC</button>
      <button id="download-txt" class="text-button" type="button">下載純文字歌詞</button>
    </div>
    <button id="import-button" class="primary-button" type="button">匯入到 YuMeew 字幕編輯器</button>
    <p class="hint">會寫入 subtitle-editor.html 使用的本機字幕欄位，並自動切到（或開啟）該分頁。</p>
  </section>

  <footer>
    <p>僅在你的瀏覽器內執行，資料不會送到 YuMeew 以外的任何伺服器。</p>
  </footer>

  <script src="../lib/srt.js"></script>
  <script src="popup.js"></script>
</body>
</html>
